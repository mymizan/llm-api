version: '3.8'

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "4567:11434"
    volumes:
      - ollama_data:/root/.ollama  # Persist model cache
    entrypoint: >
      /bin/bash -c "ollama serve & sleep 3 && ollama run llama3:2"
    environment:
      - OLLAMA_HOST=0.0.0.0

volumes:
  ollama_data:
